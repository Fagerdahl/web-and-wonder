services:
  postgres:
    image: postgres:16
    container_name: webwonder-postgres

    environment:
      POSTGRES_DB: webwonder
      POSTGRES_USER: webwonder
      POSTGRES_PASSWORD: webwonder_dev

    ports:
      - "5432:5432"

    volumes:
      - webwonder_postgres_data:/var/lib/postgresql/data

volumes:
  webwonder_postgres_data: